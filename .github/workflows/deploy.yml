name: Deploy to DirectAdmin (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cegah dua deploy berjalan bersamaan (deploy berikutnya menunggu, tidak membatalkan yang sedang jalan)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Fast Deploy to DirectAdmin via SCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Archive Core and Public files
        run: |
          # 1. Arsipkan kode Laravel Core (dari folder sources/)
          cd sources
          tar -czf /tmp/core.tar.gz \
            --warning=no-file-changed \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.idea' \
            --exclude='./.vscode' \
            --exclude='./tests' \
            --exclude='./node_modules' \
            --exclude='./vendor' \
            --exclude='./scratch' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            --exclude='./*.sqlite' \
            --exclude='./*.sql' \
            --exclude='./*.zip' \
            --exclude='./*.rar' \
            --exclude='./phpunit.xml' \
            .
          cd ..

          # 2. Arsipkan Public Web Files (index.php, .htaccess, dan folder public)
          tar -czf /tmp/public.tar.gz \
            --warning=no-file-changed \
            index.php .htaccess public

          mv /tmp/core.tar.gz ./core.tar.gz
          mv /tmp/public.tar.gz ./public.tar.gz

      - name: Package env & upload archives to DirectAdmin via SCP
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          TARGET_DOMAIN: ${{ secrets.TARGET_DOMAIN }}
          # Nilai untuk .env server (kosong = nilai di .env server tidak diubah)
          APP_NAME: ${{ secrets.APP_NAME || 'PMB TSU' }}
          APP_URL: ${{ secrets.APP_URL }}
          ASSET_URL: ${{ secrets.ASSET_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION || 'mysql' }}
          DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HOMEBASE_URL: ${{ secrets.HOMEBASE_URL }}
          TSU_SSO_CLIENT_ID: ${{ secrets.TSU_SSO_CLIENT_ID }}
          TSU_SSO_CLIENT_SECRET: ${{ secrets.TSU_SSO_CLIENT_SECRET }}
          TSU_SSO_REDIRECT_URI: ${{ secrets.TSU_SSO_REDIRECT_URI }}
          HOMEBASE_CLIENT_ID: ${{ secrets.HOMEBASE_CLIENT_ID }}
          HOMEBASE_CLIENT_SECRET: ${{ secrets.HOMEBASE_CLIENT_SECRET }}
          PIKDI_EMERGENCY_SECRET: ${{ secrets.PIKDI_EMERGENCY_SECRET }}
          PIKDI_RESCUE_SECRET: ${{ secrets.PIKDI_RESCUE_SECRET }}
          PIKDI_SYNC_SECRET: ${{ secrets.PIKDI_SYNC_SECRET }}
          # SMTP pengirim email (kosong = nilai di .env server tidak diubah)
          MAIL_MAILER: ${{ secrets.MAIL_MAILER }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: |
          if [ -z "$TARGET_DOMAIN" ] || [ -z "$APP_URL" ]; then
            echo "::error::Secret TARGET_DOMAIN dan APP_URL wajib diisi."
            exit 1
          fi

          # Kemas semua nilai .env dalam base64 agar karakter khusus ($ ' " & | \) tidak diolah shell server
          umask 077
          : > deploy.env
          for key in APP_NAME APP_URL ASSET_URL FRONTEND_URL DB_CONNECTION DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD \
                     HOMEBASE_URL TSU_SSO_CLIENT_ID TSU_SSO_CLIENT_SECRET TSU_SSO_REDIRECT_URI HOMEBASE_CLIENT_ID HOMEBASE_CLIENT_SECRET \
                     PIKDI_EMERGENCY_SECRET PIKDI_RESCUE_SECRET PIKDI_SYNC_SECRET \
                     MAIL_MAILER MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_ENCRYPTION MAIL_FROM_ADDRESS MAIL_FROM_NAME; do
            printf '%s=%s\n' "$key" "$(printf '%s' "${!key}" | base64 -w0)" >> deploy.env
          done

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -P 22 -o StrictHostKeyChecking=no -o BatchMode=yes -i ~/.ssh/deploy_key core.tar.gz public.tar.gz deploy.env ${SSH_USER}@${SSH_HOST}:~/domains/${TARGET_DOMAIN}/
          rm -f ~/.ssh/deploy_key deploy.env

      - name: Deploy & Execute Server Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DOMAIN: ${{ secrets.TARGET_DOMAIN }}
          CORE_DIR: ${{ secrets.CORE_DIR || 'tsu_pmb_core' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DOMAIN,CORE_DIR
          script: |
            set -e

            DOMAIN_PATH="$HOME/domains/${TARGET_DOMAIN}"
            CORE_PATH="${DOMAIN_PATH}/${CORE_DIR}"
            PUBLIC_PATH="${DOMAIN_PATH}/public_html"
            STAGE_PATH="${DOMAIN_PATH}/.deploy_stage"
            COMPOSER="${DOMAIN_PATH}/composer.phar"
            ENV_FILE="${DOMAIN_PATH}/deploy.env"
            WENT_DOWN=0

            # Selalu bersihkan staging & keluarkan situs dari maintenance, baik deploy sukses maupun gagal
            cleanup() {
                rc=$?
                rm -rf "$STAGE_PATH"
                rm -f "$ENV_FILE"
                if [ "$WENT_DOWN" = "1" ]; then
                    (cd "$CORE_PATH" && php artisan up) || true
                fi
                if [ "$rc" != "0" ]; then
                    echo "!!! DEPLOY GAGAL (exit $rc). Cek log di atas."
                fi
                exit $rc
            }
            trap cleanup EXIT

            # Sinkronisasi folder tanpa rsync (tidak tersedia di server):
            # salin semua file rilis, lalu hapus file di tujuan yang tidak ada di rilis.
            # Argumen ke-3 dst. = path relatif di tujuan yang dilindungi (tidak disalin & tidak dihapus)
            sync_dir() {
                local src="$1" dst="$2" p
                shift 2
                local tar_ex=() prune=()
                for p in "$@"; do
                    tar_ex+=( --exclude="./$p" )
                    prune+=( -path "./$p" -o )
                done
                mkdir -p "$dst"
                (cd "$src" && tar -cf - "${tar_ex[@]}" .) | (cd "$dst" && tar -xf -)
                (cd "$dst" && find . -mindepth 1 \( "${prune[@]}" -false \) -prune -o -print) > "$STAGE_PATH/.sync_list"
                while IFS= read -r p; do
                    if [ ! -e "$src/$p" ] && [ ! -L "$src/$p" ]; then
                        rm -rf "${dst:?}/$p"
                    fi
                done < "$STAGE_PATH/.sync_list"
                rm -f "$STAGE_PATH/.sync_list"
            }

            # Muat nilai .env dari paket base64 hasil upload, lalu hapus filenya
            [ -f "$ENV_FILE" ] || { echo "deploy.env tidak ditemukan di server."; exit 1; }
            while IFS= read -r env_line || [ -n "$env_line" ]; do
                [ -z "$env_line" ] && continue
                env_key="${env_line%%=*}"
                env_val="$(printf '%s' "${env_line#*=}" | base64 -d)"
                export "$env_key=$env_val"
            done < "$ENV_FILE"
            rm -f "$ENV_FILE"

            # ASSET_URL & FRONTEND_URL mengikuti APP_URL jika tidak diisi
            [ -n "$ASSET_URL" ] || ASSET_URL="$APP_URL"
            [ -n "$FRONTEND_URL" ] || FRONTEND_URL="$APP_URL"

            # ===============================================================
            # TAHAP A: PERSIAPAN (situs belum disentuh, aman jika gagal)
            # ===============================================================

            # A1. Ekstrak rilis ke folder staging
            rm -rf "$STAGE_PATH"
            mkdir -p "$STAGE_PATH/core" "$STAGE_PATH/public" "$CORE_PATH" "$PUBLIC_PATH"
            tar -xzf "${DOMAIN_PATH}/core.tar.gz" -C "$STAGE_PATH/core/"
            tar -xzf "${DOMAIN_PATH}/public.tar.gz" -C "$STAGE_PATH/public/"
            rm -f "${DOMAIN_PATH}/core.tar.gz" "${DOMAIN_PATH}/public.tar.gz"

            # A2. Pastikan PHP server memenuhi kebutuhan composer.lock sebelum situs diubah
            wget -q -O "$COMPOSER" https://getcomposer.org/download/latest-stable/composer.phar
            (cd "$STAGE_PATH/core" && php "$COMPOSER" check-platform-reqs --no-dev --lock)

            # ===============================================================
            # TAHAP B: RILIS (situs masuk maintenance mode)
            # ===============================================================

            if [ -f "$CORE_PATH/artisan" ] && [ -d "$CORE_PATH/vendor" ]; then
                (cd "$CORE_PATH" && php artisan down --retry=60) && WENT_DOWN=1
            fi

            # B1. Sinkronisasi kode core (file yang dihapus di repo ikut terhapus di server)
            #     Data server (.env, storage upload, vendor, cache) tidak disentuh
            sync_dir "$STAGE_PATH/core" "$CORE_PATH" \
                .env .env.backup .env.production .env.tmp \
                storage vendor bootstrap/cache public node_modules

            # B2. Sinkronisasi public_html
            #     index.php & .htaccess ditimpa, folder public/ disinkronkan penuh (kecuali symlink storage)
            #     File lain di public_html (.well-known, dsb.) tidak disentuh
            cp -f "$STAGE_PATH/public/index.php" "$STAGE_PATH/public/.htaccess" "$PUBLIC_PATH/"
            mkdir -p "$PUBLIC_PATH/public"
            sync_dir "$STAGE_PATH/public/public" "$PUBLIC_PATH/public" storage

            # Sesuaikan path autoloader index.php di public_html agar mengarah ke folder core
            cd "$PUBLIC_PATH"
            sed -i "s|__DIR__.'/sources/|__DIR__.'/../${CORE_DIR}/|g" index.php

            # Buat symlink akses aset jika dipanggil langsung via /assets/ maupun /public/assets/
            if [ -d public/assets ] && [ ! -e assets ]; then
                ln -sfn public/assets assets
            fi

            # B3. Masuk ke core untuk inisialisasi folder, dependensi & environment
            cd "$CORE_PATH"
            mkdir -p storage/app/public storage/framework/{sessions,views,cache/data,testing} storage/logs
            mkdir -p bootstrap/cache

            # Pastikan folder public di core menunjuk ke public_html agar helper Laravel konsisten
            if [ ! -L public ]; then
                rm -rf public
                ln -sfn ../public_html public
            fi

            if [ ! -f .env ]; then cp .env.example .env; fi

            # Bersihkan variabel Secrets dari karakter enter/CRLF
            APP_NAME=$(printf '%s' "$APP_NAME" | tr -d '\r\n')
            APP_URL=$(printf '%s' "$APP_URL" | tr -d '\r\n ')
            ASSET_URL=$(printf '%s' "$ASSET_URL" | tr -d '\r\n ')
            FRONTEND_URL=$(printf '%s' "$FRONTEND_URL" | tr -d '\r\n ')
            DB_CONNECTION=$(printf '%s' "$DB_CONNECTION" | tr -d '\r\n ')
            DB_HOST=$(printf '%s' "$DB_HOST" | tr -d '\r\n ')
            DB_PORT=$(printf '%s' "$DB_PORT" | tr -d '\r\n ')
            DB_DATABASE=$(printf '%s' "$DB_DATABASE" | tr -d '\r\n ')
            DB_USERNAME=$(printf '%s' "$DB_USERNAME" | tr -d '\r\n ')
            DB_PASSWORD=$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n')

            # Helper update/tambah key di .env
            # Aman untuk karakter khusus (& | \ $ " ') karena tidak memakai sed replacement
            update_env() {
                key="$1"
                val="$2"
                [ -z "$val" ] && return 0
                case "$val" in
                    *"'"*) line="${key}=\"$(printf '%s' "$val" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')\"" ;;
                    *)     line="${key}='${val}'" ;;
                esac
                if grep -q "^${key}=" .env; then
                    K="${key}=" L="$line" awk 'index($0, ENVIRON["K"]) == 1 { print ENVIRON["L"]; next } { print }' .env > .env.tmp
                    cat .env.tmp > .env
                    rm -f .env.tmp
                else
                    printf '%s\n' "$line" >> .env
                fi
            }

            # Set environment dasar production
            update_env "APP_NAME" "$APP_NAME"
            update_env "APP_URL" "$APP_URL"
            update_env "ASSET_URL" "$ASSET_URL"
            update_env "FRONTEND_URL" "$FRONTEND_URL"
            update_env "DB_CONNECTION" "$DB_CONNECTION"
            update_env "DB_HOST" "$DB_HOST"
            update_env "DB_PORT" "$DB_PORT"
            update_env "DB_DATABASE" "$DB_DATABASE"
            update_env "DB_USERNAME" "$DB_USERNAME"
            update_env "DB_PASSWORD" "$DB_PASSWORD"
            update_env "APP_ENV" "production"
            update_env "APP_DEBUG" "false"
            update_env "FORCE_HTTPS" "true"
            update_env "SESSION_SECURE_COOKIE" "true"

            # SSO TSU Homebase
            # Redirect URI otomatis mengikuti APP_URL jika secret TSU_SSO_REDIRECT_URI tidak diisi
            TSU_SSO_REDIRECT_URI=$(printf '%s' "$TSU_SSO_REDIRECT_URI" | tr -d '\r\n ')
            if [ -z "$TSU_SSO_REDIRECT_URI" ] && [ -n "$APP_URL" ]; then
                TSU_SSO_REDIRECT_URI="${APP_URL%/}/login/sso/callback"
            fi
            update_env "TSU_SSO_REDIRECT_URI" "$TSU_SSO_REDIRECT_URI"
            update_env "HOMEBASE_URL" "$(printf '%s' "$HOMEBASE_URL" | tr -d '\r\n ')"
            update_env "TSU_SSO_URL" "$(printf '%s' "$HOMEBASE_URL" | tr -d '\r\n ')"
            update_env "TSU_SSO_CLIENT_ID" "$(printf '%s' "$TSU_SSO_CLIENT_ID" | tr -d '\r\n ')"
            update_env "TSU_SSO_CLIENT_SECRET" "$(printf '%s' "$TSU_SSO_CLIENT_SECRET" | tr -d '\r\n ')"
            update_env "HOMEBASE_CLIENT_ID" "$(printf '%s' "$HOMEBASE_CLIENT_ID" | tr -d '\r\n ')"
            update_env "HOMEBASE_CLIENT_SECRET" "$(printf '%s' "$HOMEBASE_CLIENT_SECRET" | tr -d '\r\n ')"

            # Akses darurat PIKDI (PIKDI_RESCUE_SECRET berupa hash bcrypt, mengandung karakter $)
            update_env "PIKDI_EMERGENCY_SECRET" "$(printf '%s' "$PIKDI_EMERGENCY_SECRET" | tr -d '\r\n')"
            update_env "PIKDI_RESCUE_SECRET" "$(printf '%s' "$PIKDI_RESCUE_SECRET" | tr -d '\r\n ')"
            update_env "PIKDI_SYNC_SECRET" "$(printf '%s' "$PIKDI_SYNC_SECRET" | tr -d '\r\n')"

            # SMTP pengirim email (password app/SMTP bisa mengandung spasi & karakter khusus)
            for mail_key in MAIL_MAILER MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_ENCRYPTION MAIL_FROM_ADDRESS; do
                update_env "$mail_key" "$(eval "printf '%s' \"\$$mail_key\"" | tr -d '\r\n ')"
            done
            update_env "MAIL_PASSWORD" "$(printf '%s' "$MAIL_PASSWORD" | tr -d '\r\n')"
            update_env "MAIL_FROM_NAME" "$(printf '%s' "$MAIL_FROM_NAME" | tr -d '\r\n')"

            # B4. Install vendor production
            export COMPOSER_ALLOW_SUPERUSER=1
            php "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction

            # Bersihkan config cache agar key:generate & migrate membaca config terbaru
            php artisan config:clear

            if ! grep -q "^APP_KEY=.\?base64:" .env; then
                php artisan key:generate --force
            fi

            # B5. Jalankan migrasi database SEBELUM optimize (Mencegah Table 'cache' doesn't exist)
            php artisan migrate --force

            # B6. Symlink storage publik ke public_html
            ln -sfn "$CORE_PATH/storage/app/public" "$PUBLIC_PATH/storage"
            ln -sfn "$CORE_PATH/storage/app/public" "$PUBLIC_PATH/public/storage"

            # B7. Bersihkan dan optimasi framework cache
            php artisan optimize:clear
            php artisan optimize
            php artisan view:cache

            # B8. Hak akses aman standar LiteSpeed / DirectAdmin suPHP
            chmod -R 755 storage bootstrap/cache
            chmod 600 storage/*.key 2>/dev/null || true

            echo ">>> DEPLOY SELESAI: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Health Check Production
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          BASE_URL=$(printf '%s' "$APP_URL" | tr -d '\r\n ' | sed 's|/*$||')
          FAILED=0

          # Cek halaman utama (render view + query DB), login admin, dan aset statis public
          for path in "/" "/admin" "/public/assets/img/kampustsu.png"; do
            url="${BASE_URL}${path}"
            code=000
            # Retry beberapa kali untuk memberi waktu cache/opcache server pulih
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 5
            done

            if [ "$code" = "200" ]; then
              echo "OK    [$code] $url"
            else
              echo "::error::Health check gagal [$code] $url"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "::error::Deploy selesai tetapi situs tidak sehat. Cek storage/logs/laravel.log di server dan pertimbangkan revert commit terakhir."
            exit 1
          fi
